<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="BA4THG 通联记录查询。">
  <meta name="theme-color" content="#f7f8fa">
  <title>BA4THG · 通联日志</title>
  <link rel="icon" type="image/svg+xml" href="./assets/ba4thg-mark.svg">
  <link rel="stylesheet" href="./styles.css?v=20260810-1">
  <script src="./public-api.js?v=20260810-1" defer></script>
  <script src="./qsl-apply.js?v=20260810-1" defer></script>
  <script src="./app.js?v=20260810-1" defer></script>
</head>
<body class="public-page">
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="./" aria-label="BA4THG 通联日志首页">
      <img src="./assets/ba4thg-mark.svg" alt="">
      <span><strong>BA4THG</strong><small>通联日志</small></span>
    </a>
    <nav aria-label="主导航">
      <a class="current" href="./">通联日志</a>
    </nav>
  </div>
</header>

<main class="public-main">
  <section class="station-head">
    <div>
      <h1>BA4THG</h1>
      <p>中国江苏南京 · 业余无线电台</p>
    </div>
    <p class="station-note">查询与 BA4THG 的公开通联记录。</p>
  </section>

  <section class="search-section" aria-labelledby="search-title">
    <h2 id="search-title">查询通联记录</h2>
    <form class="search-form" data-query-form>
      <label class="sr-only" for="qso-search">输入对方呼号</label>
      <input id="qso-search" name="q" autocomplete="off" spellcheck="false" maxlength="16" placeholder="输入呼号" required>
      <button class="primary" type="submit">查询</button>
    </form>
    <p class="search-hint">输入呼号后查询对应的公开通联记录。</p>
  </section>

  <section class="log-section" aria-labelledby="log-title">
    <div class="log-heading">
      <h2 id="log-title">查询结果</h2>
      <p data-result-meta>请输入呼号开始查询。</p>
    </div>
    <div class="notice error" data-error hidden></div>
    <div class="notice" data-loading hidden>正在查询……</div>
    <div class="notice" data-empty hidden>没有找到与该呼号的公开通联记录。</div>
    <div class="qso-list" data-list></div>
    <nav class="pagination" data-pagination hidden aria-label="日志分页">
      <button type="button" data-prev>上一页</button>
      <span data-page-label></span>
      <button type="button" data-next>下一页</button>
    </nav>
  </section>

  <section class="qsl-section" data-qsl-panel hidden aria-labelledby="qsl-title">
    <div class="qsl-heading">
      <div>
        <h2 id="qsl-title">申请 QSL 卡片</h2>
        <p data-qsl-message>查询到通联记录后可以申请卡片。</p>
      </div>
      <button class="secondary" type="button" data-qsl-start>申请 QSL 卡片</button>
    </div>
    <div class="qsl-body" data-qsl-body hidden></div>
  </section>
</main>

<footer class="site-footer">
  <span>BA4THG · 业余无线电通联日志</span>
  <span>73，期待与你在电波中相遇。</span>
</footer>
</body>
</html>
