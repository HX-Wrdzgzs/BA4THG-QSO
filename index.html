<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="BA4THG 长期公开 QSO 通联档案。">
  <meta name="theme-color" content="#f7f8fa">
  <title>BA4THG · 通联日志</title>
  <link rel="icon" type="image/svg+xml" href="./assets/ba4thg-mark.svg">
  <link rel="stylesheet" href="./styles.css?v=20260808-5">
  <script src="./app.js?v=20260808-5" defer></script>
</head>
<body class="public-page">
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="./" aria-label="BA4THG 通联日志首页">
      <img src="./assets/ba4thg-mark.svg" alt="">
      <span><strong>BA4THG</strong><small>通联日志</small></span>
    </a>
    <nav aria-label="主导航">
      <a class="current" href="./">通联日志</a>
      <a href="./admin.html">档案管理</a>
    </nav>
  </div>
</header>

<main class="public-main">
  <section class="station-head">
    <div>
      <h1>BA4THG</h1>
      <p>中国江苏南京 · 业余无线电台</p>
    </div>
    <p class="station-note">近期记录实时读取第三方小程序公开接口；已归档记录由本站长期保存。</p>
  </section>

  <section class="search-section" aria-labelledby="search-title">
    <h2 id="search-title">查询通联记录</h2>
    <form class="search-form" data-query-form>
      <label class="sr-only" for="qso-search">搜索通联记录</label>
      <input id="qso-search" name="q" autocomplete="off" spellcheck="false" placeholder="搜索呼号、地点、设备、频率或备注">
      <button class="primary" type="submit">搜索</button>
    </form>
    <p class="search-hint">例如输入 BA4VRM 或 430.610；留空查看全部记录。</p>
  </section>

  <section class="log-section" aria-labelledby="log-title">
    <div class="log-heading">
      <h2 id="log-title">通联记录</h2>
      <p data-result-meta>正在读取……</p>
    </div>
    <div class="notice error" data-error hidden></div>
    <div class="notice" data-loading hidden>正在读取通联档案……</div>
    <div class="notice" data-empty hidden>没有找到匹配的通联记录。</div>
    <div class="qso-list" data-list></div>
    <nav class="pagination" data-pagination hidden aria-label="日志分页">
      <button type="button" data-prev>上一页</button>
      <span data-page-label></span>
      <button type="button" data-next>下一页</button>
    </nav>
  </section>
</main>

<footer class="site-footer">
  <span>BA4THG · 业余无线电通联档案</span>
  <span>73，期待与你在电波中相遇。</span>
</footer>
</body>
</html>
