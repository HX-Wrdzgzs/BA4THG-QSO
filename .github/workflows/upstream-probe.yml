name: Upstream QSO probe

on:
  push:
    paths:
      - '.github/workflows/upstream-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe mzyyun public QSO API
        shell: bash
        run: |
          set -u
          url='https://api.mzyyun.com/public/qso?callsign=BA4VRM&role=contact&page=1&limit=20'
          headers="$(mktemp)"
          body="$(mktemp)"
          result='.github/upstream-probe-result.txt'

          status="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 20 \
            -H 'Accept: application/json' \
            -H 'Origin: https://qso.mizuki.top' \
            -D "$headers" -o "$body" -w '%{http_code}' \
            "$url" || true)"

          {
            echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "http_status=$status"
            echo 'headers:'
            grep -iE '^(content-type|server|cf-ray|x-request-id|x-powered-by):' "$headers" || true
            echo 'summary:'
            python3 - "$body" <<'PY'
          import json, sys
          p = sys.argv[1]
          raw = open(p, 'rb').read(65536)
          try:
              data = json.loads(raw.decode('utf-8', 'replace'))
          except Exception:
              text = raw.decode('utf-8', 'replace').strip().replace('\n', ' ')
              print(text[:500])
          else:
              safe = {
                  'error': data.get('error'),
                  'total': data.get('total'),
                  'page': data.get('page'),
                  'limit': data.get('limit'),
                  'captchaRequired': data.get('captchaRequired'),
                  'hasItems': bool(data.get('items')),
                  'itemCount': len(data.get('items') or []),
              }
              print(json.dumps(safe, ensure_ascii=False))
          PY
          } > "$result"

          cat "$result"

      - name: Commit sanitized probe result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/upstream-probe-result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '记录上游 QSO API 探针结果'
          git push
