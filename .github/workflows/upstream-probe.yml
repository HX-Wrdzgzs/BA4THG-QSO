name: Production edge probe

on:
  push:
    paths:
      - '.github/workflows/upstream-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Probe custom and Pages domains
        shell: bash
        run: |
          set -u
          result='.github/upstream-probe-result.txt'
          : > "$result"
          echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$result"

          probe() {
            local name="$1"
            local endpoint="$2"
            local headers body status
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 25 \
              -H 'Accept: application/json' -D "$headers" -o "$body" -w '%{http_code}' "$endpoint" || true)"
            {
              echo
              echo "[$name]"
              echo "http_status=$status"
              grep -iE '^(content-type|server|cf-ray|cf-mitigated):' "$headers" || true
              python3 - "$body" <<'PY'
          import json, sys
          raw=open(sys.argv[1],'rb').read(131072)
          try:
              data=json.loads(raw.decode('utf-8','replace'))
          except Exception:
              text=raw.decode('utf-8','replace').strip().replace('\n',' ')
              print('summary=' + text[:240])
          else:
              up=data.get('upstream') or {}
              fb=data.get('fallback') or {}
              arc=fb.get('archived') or {}
              safe={
                  'error':data.get('error'),
                  'station':data.get('station'),
                  'search':data.get('search'),
                  'total':data.get('total'),
                  'itemCount':len(data.get('items') or []),
                  'source':data.get('source'),
                  'stale':data.get('stale'),
                  'complete':data.get('complete'),
                  'degraded':data.get('degraded'),
                  'upstreamStatus':up.get('status'),
                  'upstreamOk':up.get('ok'),
                  'fallbackOk':fb.get('ok'),
                  'fallbackKind':fb.get('kind'),
                  'fallbackFetched':arc.get('fetched'),
                  'fallbackInserted':arc.get('inserted'),
                  'fallbackUpdated':arc.get('updated'),
                  'fallbackLinked':arc.get('linkedToExisting'),
                  'fallbackRejected':arc.get('rejected'),
              }
              print('summary=' + json.dumps(safe,ensure_ascii=False))
          PY
            } >> "$result"
            rm -f "$headers" "$body"
          }

          query='/api/public/qsos?q=BA4VRM&page=1&limit=20'
          probe 'custom-domain' "https://qso.mizuki.top$query"
          probe 'pages-default-domain' "https://ba4thg-qso.pages.dev$query"

          cat "$result"

      - name: Commit sanitized probe result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/upstream-probe-result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '记录生产 QSO API 双域名探针结果'
          git push
