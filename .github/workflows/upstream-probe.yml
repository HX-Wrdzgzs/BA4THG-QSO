name: Upstream QSO probe

on:
  push:
    paths:
      - '.github/workflows/upstream-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe mzyyun public QSO API
        shell: bash
        run: |
          set -u
          result='.github/upstream-probe-result.txt'
          : > "$result"
          echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$result"

          probe() {
            local name="$1"
            local origin="$2"
            local url="$3"
            local headers body status
            headers="$(mktemp)"
            body="$(mktemp)"

            args=(--silent --show-error --location --connect-timeout 10 --max-time 20 -H 'Accept: application/json')
            if [[ -n "$origin" ]]; then
              args+=(-H "Origin: $origin")
            fi

            status="$(curl "${args[@]}" -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            {
              echo
              echo "[$name]"
              echo "origin=${origin:-<none>}"
              echo "http_status=$status"
              grep -iE '^(content-type|server|cf-ray|x-request-id|x-powered-by):' "$headers" || true
              python3 - "$body" <<'PY'
          import json, sys
          raw = open(sys.argv[1], 'rb').read(65536)
          try:
              data = json.loads(raw.decode('utf-8', 'replace'))
          except Exception:
              text = raw.decode('utf-8', 'replace').strip().replace('\n', ' ')
              print('summary=' + text[:500])
          else:
              safe = {
                  'error': data.get('error'),
                  'total': data.get('total'),
                  'page': data.get('page'),
                  'limit': data.get('limit'),
                  'captchaRequired': data.get('captchaRequired'),
                  'hasItems': bool(data.get('items')),
                  'itemCount': len(data.get('items') or []),
              }
              print('summary=' + json.dumps(safe, ensure_ascii=False))
          PY
            } >> "$result"
            rm -f "$headers" "$body"
          }

          base='https://api.mzyyun.com/public/qso'
          query="$base?callsign=BA4VRM&role=contact&page=1&limit=20"
          probe 'no-origin-valid-query' '' "$query"
          probe 'unregistered-origin-valid-query' 'https://example.com' "$query"
          probe 'mzyyun-origin-valid-query' 'https://mzyyun.com' "$query"
          probe 'qso-origin-ba4vrm-contact' 'https://qso.mizuki.top' "$query"
          probe 'qso-origin-no-match-contact' 'https://qso.mizuki.top' "$base?callsign=BG4ZZZ&role=contact&page=1&limit=20"
          probe 'qso-origin-operator' 'https://qso.mizuki.top' "$base?callsign=BA4THG&role=operator&page=1&limit=20"
          probe 'qso-origin-invalid-callsign' 'https://qso.mizuki.top' "$base?callsign=INVALID!&role=contact&page=1&limit=20"

          cat "$result"

      - name: Commit sanitized probe result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/upstream-probe-result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '记录上游 QSO API Origin 对照结果'
          git push
