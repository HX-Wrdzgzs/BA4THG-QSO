name: Production QSO smoke

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Pages deployment and verify BA4VRM archive
        shell: bash
        run: |
          set -u
          pages_endpoint='https://ba4thg-qso.pages.dev/api/public/qsos?q=BA4VRM&page=1&limit=20'
          custom_api='https://qso.mizuki.top/api/public/qsos?q=BA4VRM&page=1&limit=20'
          custom_root='https://qso.mizuki.top/'
          body="$(mktemp)"
          headers="$(mktemp)"
          matched=0
          status=0

          for attempt in $(seq 1 18); do
            : > "$headers"
            status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 20 \
              -H 'Accept: application/json' -D "$headers" -o "$body" -w '%{http_code}' "$pages_endpoint" || true)"

            if python3 - "$body" <<'PY'
          import json, sys
          try:
              data=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          ok=(
              'fallback' in data and
              data.get('station')=='BA4THG' and
              data.get('search')=='BA4VRM' and
              int(data.get('total') or 0)>=4 and
              len(data.get('items') or [])>=4
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              matched=1
              break
            fi

            echo "waiting for target Pages deployment: attempt=$attempt status=$status"
            sleep 10
          done

          echo "pages_target_version_seen=$matched"
          echo "pages_http_status=$status"
          grep -iE '^(content-type|server|cf-ray|cf-mitigated):' "$headers" | sed 's/^/pages_/' || true
          python3 - "$body" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          up=data.get('upstream') or {}
          fb=data.get('fallback') or {}
          print('pages_station=' + str(data.get('station')))
          print('pages_search=' + str(data.get('search')))
          print('pages_total=' + str(data.get('total')))
          print('pages_item_count=' + str(len(data.get('items') or [])))
          print('pages_upstream_status=' + str(up.get('status')))
          print('pages_upstream_ok=' + str(up.get('ok')))
          print('pages_fallback_ok=' + str(fb.get('ok')))
          PY

          probe_edge() {
            local label="$1"
            local endpoint="$2"
            local accept="$3"
            local ph pb ps
            ph="$(mktemp)"
            pb="$(mktemp)"
            ps="$(curl --silent --show-error --location --connect-timeout 10 --max-time 20 \
              -H "Accept: $accept" -D "$ph" -o "$pb" -w '%{http_code}' "$endpoint" || true)"
            echo "${label}_http_status=$ps"
            grep -iE '^(content-type|server|cf-ray|cf-mitigated):' "$ph" | sed "s/^/${label}_/" || true
            rm -f "$ph" "$pb"
          }

          probe_edge 'custom_root' "$custom_root" 'text/html,application/xhtml+xml'
          probe_edge 'custom_api' "$custom_api" 'application/json'

          rm -f "$body" "$headers"
          test "$matched" = 1
          test "$status" = 200
