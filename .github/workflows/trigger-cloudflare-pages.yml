name: Trigger Cloudflare Pages

on:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_PAGES_DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK is not configured; skipping explicit deploy hook."
            exit 0
          fi

          curl --fail --silent --show-error \
            --request POST \
            "$CLOUDFLARE_PAGES_DEPLOY_HOOK"

          echo "Cloudflare Pages deploy hook triggered."
