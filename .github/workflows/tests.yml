name: QSO Functions tests

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run tests and record result
        shell: bash
        run: |
          set +e
          log="$(mktemp)"
          node --test >"$log" 2>&1
          code=$?
          {
            echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "exit_code=$code"
            echo '--- tail ---'
            tail -n 120 "$log"
          } > .github/tests-result.txt
          cat .github/tests-result.txt
          rm -f "$log"
          exit "$code"

      - name: Commit test result
        if: always()
        shell: bash
        run: |
          test -f .github/tests-result.txt || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/tests-result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '记录 QSO Functions 回归测试结果'
          git push
